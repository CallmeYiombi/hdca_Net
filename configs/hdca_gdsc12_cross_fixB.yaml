mat_dir: data/matrices_gdsc12
out_dir: results/hdca_gdsc12_fixB

# Validation split for cross mode
val_strategy: random
val_frac: 0.1

# Model — HDCA-Net + Fix B (BatchNorm pathway-wise normalization)
drug_enc_hidden: 512
drug_enc_out: 256
gate_mode: hard
gate_gamma: 2.0
fp_input_dropout: 0.0
use_mutation: false
dropout: 0.3
lambda_neg: 0.1
mask_dropout: 0.1

# Fix B: LayerNorm → BatchNorm1d for norm_p_gene_align / norm_p_path_align / norm_cell
norm_type: batch

# Training -- same as diag2 (with val_strategy=random, best_ep=53 was the normal case)
seed: 42
epochs: 120
batch_size: 1024
lr: 0.0001
weight_decay: 0.00001
lr_patience: 15
early_stop: 80
num_workers: 4

# Cross-eval hook
cross_hook_every: 5

# Ablation budget (for drug-5fold; unused)
ablation_epochs: 60
ablation_early_stop: 15
ablation_lr_patience: 5

# GPU (B200 #4)
cuda_device: 4
