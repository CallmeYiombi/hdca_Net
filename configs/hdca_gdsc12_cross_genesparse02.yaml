mat_dir: data/matrices_gdsc12
out_dir: results/hdca_gdsc12_genesparse02

# Validation split for cross mode: drug | random | cell
val_strategy: random
val_frac: 0.1

# Model — HDCA-Net (Hierarchical Drug-Cell Cross-Alignment)
drug_enc_hidden: 512
drug_enc_out: 256
gate_mode: hard
gate_gamma: 2.0
fp_input_dropout: 0.0
use_mutation: false
dropout: 0.3
lambda_neg: 0.1
mask_dropout: 0.1

# Fix A: resolve the align_weights collapse (batch-wise diversity regularization)
#  -lambda_align_div * std(align_weights, dim=0).mean() is added to the loss.
#  Purpose: break the collapse in which 75% of drugs share one weight (0.785/0.215).
lambda_align_div: 0.1

# #8 gene-branch sparsity: minimize size-normalized entropy of gene attention
#  so it concentrates on the true target inside the over-broad HCDT mask.
lambda_gene_sparse: 0.2

# Training -- based on diag2 (lr=1e-4, lr_patience=15, early_stop=80)
seed: 42
epochs: 120
batch_size: 1024
lr: 0.0001
weight_decay: 0.00001
lr_patience: 15
early_stop: 80
num_workers: 4

# Cross-eval hook
cross_hook_every: 5

# Ablation (kept for compatibility)
ablation_epochs: 60
ablation_early_stop: 15
ablation_lr_patience: 5

# GPU
cuda_device: 4
