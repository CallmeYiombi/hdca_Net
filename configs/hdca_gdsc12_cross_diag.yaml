mat_dir: data/matrices_gdsc12
out_dir: results/hdca_gdsc12_diag2

# Validation split for cross mode: drug | random | cell
val_strategy: random
val_frac: 0.1

# Model — HDCA-Net (Hierarchical Drug-Cell Cross-Alignment)
drug_enc_hidden: 512
drug_enc_out: 256
gate_mode: hard
gate_gamma: 2.0
fp_input_dropout: 0.0
use_mutation: false
dropout: 0.3
lambda_neg: 0.1
mask_dropout: 0.1

# Training -- diagnostic for best_ep=1 (lower lr, longer patience)
seed: 42
epochs: 120
batch_size: 1024
lr: 0.0001           # 3e-4 → 1e-4
weight_decay: 0.00001
lr_patience: 15      # 7 → 15
early_stop: 80       # 30 -> 80, so the run continues even when best_ep=1
num_workers: 4

# Cross-eval hook: used in cross mode only; measures CCLE/gCSI PCC every N epochs
cross_hook_every: 5

# Ablation budget (not used by drug-5fold; kept for compatibility)
ablation_epochs: 60
ablation_early_stop: 15
ablation_lr_patience: 5

# GPU (B200 #4)
cuda_device: 4
