# Architecture-side intervention under the broad mask: BatchNorm on gene and cell, LayerNorm on pathway.
mat_dir: data/matrices_gdsc12
hcdt_drug_gene_file: hcdt_drug_gene.npy
out_dir: results/hdca_gdsc12_broad_hybridBN

val_strategy: random
val_frac: 0.1

drug_enc_hidden: 512
drug_enc_out: 256
gate_mode: hard
gate_gamma: 2.0
fp_input_dropout: 0.0
use_mutation: false
dropout: 0.3
lambda_neg: 0.1
mask_dropout: 0.1

lambda_align_div: 0.3

seed: 42
epochs: 120
batch_size: 1024
lr: 0.0001
weight_decay: 0.00001
lr_patience: 15
early_stop: 80
num_workers: 4

cross_hook_every: 5

ablation_epochs: 60
ablation_early_stop: 15
ablation_lr_patience: 5

norm_type: layer
gene_norm_type: batch
path_norm_type: layer
cell_norm_type: batch
